# DNS interno do Docker: reavalia os IPs do serviço "backend" a cada 10s.
# Assim o NGINX enxerga réplicas novas (scale) e containers reiniciados (IP novo)
# sem precisar ser reiniciado.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    # zone é obrigatório para o parâmetro "resolve"
    zone backend_upstream 64k;

    # Round-robin (padrão) entre todas as réplicas resolvidas para "backend".
    # Após 3 falhas em 10s, a réplica sai do pool por 10s.
    server backend:5000 resolve max_fails=3 fail_timeout=10s;

    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Healthcheck do próprio NGINX
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: /api/create -> backend:/create, /api/guess/<id> -> backend:/guess/<id>
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Failover: se uma réplica cair, tenta a próxima
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Expõe qual réplica atendeu (útil para validar o balanceamento)
        add_header X-Upstream $upstream_addr always;
    }

    # Frontend React (SPA): rotas /maker e /breaker caem no index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
