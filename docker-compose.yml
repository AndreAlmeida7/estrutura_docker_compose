name: guess-game

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      # via TCP, para só ficar pronto depois que o script de init terminar
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  backend:
    image: guess-backend:${BACKEND_VERSION:-1.0.0}
    build: .
    restart: unless-stopped
    environment:
      FLASK_DB_TYPE: postgres
      FLASK_DB_HOST: db
      FLASK_DB_USER: ${POSTGRES_USER:-postgres}
      FLASK_DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
      FLASK_DB_NAME: ${POSTGRES_DB:-postgres}
    deploy:
      replicas: 3
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - backend

  nginx:
    image: guess-frontend:${FRONTEND_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true
